[package]
name = "SimpleMediaOrganizer"
version = "1.0.0"
description = "Simple Media Organizer"
authors = ["SimpleMediaOrganizer"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.33"
walkdir = "2.5"
open = "5.3"
chrono = "0.4"
trash = "5.2"
base64 = "0.22"
tauri-plugin-drag = "2"
drag = "2"

